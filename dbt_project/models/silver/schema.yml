version: 2

models:
  - name: customers
    description: "Silver customers cleaned and deduplicated"
    columns:
      - name: customer_key
        tests: [not_null, unique]
      - name: customer_id
        tests:
          - unique:
              severity: warn
      - name: full_name
        tests: [not_null]
  - name: products
    description: "Silver products cleaned"
    columns:
      - name: product_id
        tests: [not_null, unique]
      - name: product_name
        tests: [not_null]
  - name: sales
    description: "Silver sales cleaned and deduplicated"
    columns:
      - name: sale_key
        tests: [not_null, unique]
      - name: sale_id
        tests:
          - unique:
              severity: warn
      - name: sales_amount
        tests: [not_null]